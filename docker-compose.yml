services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  apk-server:
    build: ./apk-server
    ports:
      - "8080:80"
    volumes:
      - ./apk-server/apk:/usr/share/nginx/html:ro
    restart: unless-stopped
